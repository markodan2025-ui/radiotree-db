      - name: Install deps
        if: inputs.task != 'bootstrap'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q requests

      - name: Run task
        if: inputs.task != 'bootstrap'
        env:
          WORKERS: "20"
          PER_TAG: "150"
          PICK_TOTAL: ${{ inputs.total }}
          PICK_MIN_BR: ${{ inputs.min_bitrate }}
          PICK_MIN_UPTIME: ${{ inputs.min_uptime }}
          PICK_RESET: ${{ inputs.reset && '1' || '0' }}
          IMPORT_GENRE: ${{ inputs.genre }}
          IMPORT_VERDICT: ${{ inputs.verdict }}
        run: |
          set -e
          TASK="${{ inputs.task }}"
          if [ -z "$TASK" ]; then TASK="daily"; fi
          echo "== task: $TASK =="
          case "$TASK" in
            fetch)    python tools/fetch_candidates.py; python tools/check.py; python tools/build_db.py ;;
            check)    python tools/check.py; python tools/build_db.py ;;
            import)   python tools/import_list.py; python tools/check.py; python tools/build_db.py ;;
            autopick) python tools/autopick.py; python tools/build_db.py ;;
            build)    python tools/build_db.py ;;
            daily)    python tools/check.py; python tools/build_db.py ;;
            *)        echo "Nepoznat task: $TASK"; exit 1 ;;
          esac

      - name: Commit
        run: |
          git config user.name "radiotree-bot"
          git config user.email "bot@radiotree.app"
          git add -A ':!.github'
          if git diff --cached --quiet; then
            echo "Nema promjena."
          else
            git commit -m "db: ${{ inputs.task || 'daily' }}"
            git push
          fi
