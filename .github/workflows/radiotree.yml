name: RadioTree DB

# JEDAN workflow za sve. Zadatak biras iz padajuceg izbornika.
# Nema drugih .yml fajlova jer GITHUB_TOKEN ne smije pisati u .github/workflows/.
.git

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Sto radimo"
        type: choice
        options: [bootstrap, fetch, check, import, autopick, build]
        default: bootstrap
      total:
        description: "autopick: koliko stanica"
        default: "500"
      min_bitrate:
        description: "autopick: min izmjereni bitrate"
        default: "128"
      min_uptime:
        description: "autopick: min uptime (0.8 = 80%)"
        default: "0.8"
      reset:
        description: "autopick: obrisi prethodne auto-odluke"
        type: boolean
        default: true
      genre:
        description: "import: zadani zanr"
        default: "artist"
      verdict:
        description: "import: odmah postavi odluku"
        type: choice
        options: ["", "maybe", "yes"]
        default: ""
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: radiotree-db
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack project
